<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Panel - Notification Sender</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #090d16; color: #fff; max-width: 500px; margin: 0 auto; padding: 15px; }
        
        .header-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; border-bottom: 1px solid #1f2a3e; padding-bottom: 12px; }
        .back-btn { font-size: 18px; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; background: #141a26; border: 1px solid #1f2a3e; border-radius: 50%; }

        .card { background: #141a26; border: 1px solid #1f2a3e; padding: 18px; border-radius: 14px; margin-bottom: 20px; }
        h3 { color: #00e5ff; margin-bottom: 16px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 14px; }
        label { font-size: 13px; color: #a0aec0; display: block; margin-bottom: 6px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; background: #0d111a; border: 1px solid #1f2a3e; color: #fff; border-radius: 8px; outline: none; font-size: 14px; }
        textarea { resize: none; height: 80px; }

        .toggle-box { display: flex; align-items: center; justify-content: space-between; background: #0d111a; padding: 12px; border-radius: 8px; border: 1px solid #1f2a3e; margin-bottom: 14px; }
        .toggle-box span { font-size: 13px; font-weight: bold; color: #00e5ff; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1f2a3e; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff2a6d; }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-send { width: 100%; background: #ff2a6d; color: #fff; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 style="font-size: 18px; color: #fff;">Worker Notification Panel</h2>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-paper-plane"></i> নোটিফিকেশন পাঠান</h3>
        
        <div class="form-group">
            <label>ওয়ার্কার নাম / আইডি</label>
            <input type="text" id="worker-name" placeholder="যেমন: Worker-1">
        </div>

        <div class="form-group">
            <label>কাদের পাঠাবেন (Target Audience)</label>
            <select id="target-type">
                <option value="ALL">সকল ইউজার (All Users)</option>
                <option value="MATCH_USERS">নির্দিষ্ট ম্যাচের ইউজার (Match Players)</option>
                <option value="SINGLE_USER">নির্দিষ্ট ইউজার (User ID / Phone)</option>
            </select>
        </div>

        <div class="form-group" id="match-id-group" style="display: none;">
            <label>ম্যাচ আইডি (Match ID)</label>
            <input type="text" id="match-id" placeholder="যেমন: MATCH123">
        </div>

        <div class="form-group" id="single-user-group" style="display: none;">
            <label>ইউজার আইডি / ফোন নম্বর</label>
            <input type="text" id="single-user-id" placeholder="যেমন: USER_9983">
        </div>

        <div class="form-group">
            <label>নোটিফিকেশন টাইটেল</label>
            <input type="text" id="notif-title" placeholder="যেমন: রুম আইডি দেওয়া হয়েছে!">
        </div>

        <div class="form-group">
            <label>বিবরণ / নোটিশ মেসেজ</label>
            <textarea id="notif-body" placeholder="যেমন: দ্রুত জয়েন করুন, ম্যাচ শুরু হতে ২ মিনিট বাকি!"></textarea>
        </div>

        <div class="toggle-box">
            <span>রুম আইডি ও পাসওয়ার্ড যুক্ত করবেন?</span>
            <label class="switch">
                <input type="checkbox" id="room-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div id="room-input-section" style="display: none;">
            <div class="form-group">
                <label>রুম আইডি (Room ID)</label>
                <input type="text" id="room-id" placeholder="যেমন: 882910">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড (Password)</label>
                <input type="text" id="room-pass" placeholder="যেমন: 1234">
            </div>
        </div>

        <button class="btn-send" id="send-btn"><i class="fa-solid fa-bell"></i> সেন্ড নোটিফিকেশন</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8jX_M4iqwdMm-RP10CUjd664GZrnrmQA",
            authDomain: "rz-mod-menu.firebaseapp.com",
            databaseURL: "https://rz-mod-menu-default-rtdb.firebaseio.com",
            projectId: "rz-mod-menu",
            storageBucket: "rz-mod-menu.firebasestorage.app",
            messagingSenderId: "426988321516",
            appId: "1:426988321516:web:33c8fd9492ee0ad58b03c9",
            measurementId: "G-EDC9TH795S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('target-type').addEventListener('change', (e) => {
            document.getElementById('match-id-group').style.display = e.target.value === 'MATCH_USERS' ? 'block' : 'none';
            document.getElementById('single-user-group').style.display = e.target.value === 'SINGLE_USER' ? 'block' : 'none';
        });

        document.getElementById('room-toggle').addEventListener('change', (e) => {
            document.getElementById('room-input-section').style.display = e.target.checked ? 'block' : 'none';
        });

        document.getElementById('send-btn').addEventListener('click', async () => {
            const workerName = document.getElementById('worker-name').value || "Worker";
            const target = document.getElementById('target-type').value;
            const matchId = document.getElementById('match-id').value;
            const singleUserId = document.getElementById('single-user-id').value;
            const title = document.getElementById('notif-title').value;
            const message = document.getElementById('notif-body').value;
            const hasRoomDetails = document.getElementById('room-toggle').checked;
            const roomId = document.getElementById('room-id').value;
            const roomPass = document.getElementById('room-pass').value;

            if(!title || !message) {
                alert("টাইটেল এবং বিবরণ টাইপ করুন!");
                return;
            }

            try {
                await addDoc(collection(db, "notifications"), {
                    worker: workerName,
                    target: target,
                    matchId: target === 'MATCH_USERS' ? matchId : '',
                    singleUserId: target === 'SINGLE_USER' ? singleUserId : '',
                    title: title,
                    message: message,
                    hasRoomDetails: hasRoomDetails,
                    roomId: hasRoomDetails ? roomId : '',
                    roomPass: hasRoomDetails ? roomPass : '',
                    timestamp: serverTimestamp()
                });

                alert("নোটিফিকেশন সফলভাবে পাঠানো হয়েছে!");
                document.getElementById('notif-title').value = '';
                document.getElementById('notif-body').value = '';
                document.getElementById('room-id').value = '';
                document.getElementById('room-pass').value = '';

            } catch (err) {
                console.error("Error:", err);
                alert("পাঠাতে ব্যর্থ হয়েছে! আবার চেষ্টা করুন।");
            }
        });
    </script>
</body>
</html>
